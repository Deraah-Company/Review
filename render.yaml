# Presentation deployment: free service; changes reset when the instance is replaced.
services:
  - type: web
    name: deraah-academy-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /app/data
      - key: COOKIE_SECURE
        value: "1"
